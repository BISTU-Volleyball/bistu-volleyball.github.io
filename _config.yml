# 网站基本信息（改这里即可，全站自动生效）
title: 北京信息科技大学教职工排球协会
short_title: 信息科大教职工排协
description: 北京信息科技大学教职工排球协会网站：协会新闻、赛事回顾、风采相册和排球课堂，欢迎热爱排球的老师们加入。
lang: zh-CN
# 网站完整地址（分享卡片的图片需要完整网址）；以后换学校子域名时改这里
url: https://bistu-volleyball.github.io
timezone: Asia/Shanghai
repo: BISTU-Volleyball/bistu-volleyball.github.io

# 首页的口号、首屏大图、数字条、近期活动、照片墙，以及「关于协会」页面的内容，
# 都在发布助手的「🏠 首页」「🏛️ 关于协会」里网页编辑（存于 _data/home.json、_data/about.json）

# 文章网址形如 /posts/2026/1105-a1b2c3/
permalink: /posts/:year/:month:day-:title/
future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 栏目（key 对应文章里的 section）
sections:
  - key: news
    name: 新闻动态
    url: /news/
  - key: matches
    name: 赛事回顾
    url: /matches/
  - key: gallery
    name: 风采相册
    url: /gallery/
  - key: learn
    name: 排球课堂
    url: /learn/

# 排球课堂的分类和难度（发布助手里选）
learn:
  intro: 协会教练录制的教学短视频，以及比赛规则等学习资料。一个动作一段视频，零基础也能跟着练。
  topics: [基础动作, 战术配合, 规则裁判, 体能热身]
  levels: [入门, 进阶]

exclude:
  - README.md
  - 使用说明.md
  - tools

# 百度统计站点编号（tongji.baidu.com 账号 kathy刺 下的站点；看访问量去百度统计后台）
