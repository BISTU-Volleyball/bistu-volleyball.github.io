# 临时测试：GitHub 服务器能否访问公众号文章和图片（测试后删除）
name: fetch-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://mp.weixin.qq.com/s/TFA52PeBlGpmyKtlVPUO4A https://mp.weixin.qq.com/s/axA9-MjsEOuNV3ranRvnPg; do
            curl -s -L -A "$UA" "$u" -o a.html
            echo "== $u size=$(wc -c < a.html) title=$(grep -o "msg_title = '[^']*" a.html | head -1) content=$(grep -c 'id=\"js_content\"' a.html) verify=$(grep -c '环境异常\|完成验证' a.html)"
            img=$(grep -o 'data-src="https://mmbiz[^"]*' a.html | sed -n 3p | cut -c11- | sed 's/&amp;/\&/g')
            curl -s -A "$UA" "$img" -o i.bin; echo "img bytes=$(wc -c < i.bin) type=$(file -b i.bin | cut -c1-40)"
          done
          curl -s -o /dev/null -w "bistu news: %{http_code} %{size_download}\n" https://news.bistu.edu.cn/jjxy/00263c997cd04ecb8bf9a6b473ff1422.html
