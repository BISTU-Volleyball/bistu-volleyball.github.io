# 网站基本信息（改这里即可，全站自动生效）
title: 北京信息科技大学气排球协会
short_title: 北信科气排球
description: 北京信息科技大学气排球协会官方网站：新闻动态、赛事回顾、风采相册
lang: zh-CN
timezone: Asia/Shanghai
repo: BISTU-Volleyball/bistu-volleyball.github.io

# 首页顶部提示条（不需要时把 notice 整段删掉或注释）
notice:
  text: 2026 教职工气排球团体赛 · 精彩视频评选
  url: https://di-90.github.io/volleyball-vote/

# 文章网址形如 /posts/2026/1105-a1b2c3/
permalink: /posts/:year/:month:day-:title/
future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 栏目（key 对应文章里的 section）
sections:
  - key: news
    name: 新闻动态
    url: /news/
  - key: matches
    name: 赛事回顾
    url: /matches/
  - key: gallery
    name: 风采相册
    url: /gallery/

exclude:
  - README.md
  - 使用说明.md
