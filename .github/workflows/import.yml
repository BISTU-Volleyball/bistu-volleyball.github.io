# 转载文章：发布助手提交 _import/<编号>.json 后自动运行，抓取文章生成待审核稿（见 tools/import_article.py）
name: 转载文章
on:
  push:
    branches: [main]
    paths: ['_import/*.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - name: 抓取
        run: python tools/import_article.py --queue /tmp/msg.txt
      - name: 提交
        run: |
          git config user.name "转载助手"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _pending assets/posts _import
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "转载：$(cat /tmp/msg.txt)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: 重新构建网站（让待审核稿的照片能预览）
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
