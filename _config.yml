# 网站基本信息（改这里即可，全站自动生效）
title: 北京信息科技大学教职工排球协会
short_title: 信息科大教职工排协
description: 北京信息科技大学教职工排球协会网站：新闻动态、赛事回顾、风采相册
lang: zh-CN
timezone: Asia/Shanghai
repo: BISTU-Volleyball/bistu-volleyball.github.io

# 首页顶部提示条（不需要时把 notice 整段删掉或注释）
notice:
  text: 2026 教职工气排球团体赛 · 精彩视频评选
  url: https://di-90.github.io/volleyball-vote/
  image: /assets/img/banner.jpg
  desc: “排绽风采，聚力同行”教职工气排球团体赛即将开赛，比赛期间每天晚上发布当天的精彩视频评选，欢迎投票。
  button: 去投票

# 首页：口号、数字条（首屏大图和照片墙在发布助手「🏠 首页」里设置，存于 _data/home.json）
home:
  slogan: 无论你是萌新还是高手，这里都有你的位置！
  stats:
    - num: 2025.6
      label: 正式成立
      icon: 🏐
    - num: 200余
      label: 名会员
      icon: 👥
    - num: 三期
      label: 教职工培训班
      icon: 🎓
    - num: 每个工作日
      label: 日常训练赛
      icon: 🔥

# 文章网址形如 /posts/2026/1105-a1b2c3/
permalink: /posts/:year/:month:day-:title/
future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 栏目（key 对应文章里的 section）
sections:
  - key: news
    name: 新闻动态
    url: /news/
  - key: matches
    name: 赛事回顾
    url: /matches/
  - key: gallery
    name: 风采相册
    url: /gallery/

exclude:
  - README.md
  - 使用说明.md
  - tools
