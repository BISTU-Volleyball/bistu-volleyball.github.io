# 临时：用 8 篇样本检查转载规则（不提交任何内容），检查完删除
name: import-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pillow
      - run: |
          mkdir -p /tmp/t/tools /tmp/t/_pending && cp tools/import_article.py /tmp/t/tools/
          cd /tmp/t && python - <<'PY'
          import sys, io, glob, json
          sys.path.insert(0, 'tools'); import import_article as I
          orig = I.is_photo
          def logged(im):
              r = orig(im); print('   img', im.size, im.mode, 'KEEP' if r else 'drop'); return r
          I.is_photo = logged
          urls = ['https://mp.weixin.qq.com/s/Gd0iHXsVvUmnEeq5U04GAA','https://mp.weixin.qq.com/s/salr9JORj_C4SeVIf6_bkA','https://mp.weixin.qq.com/s/fEGb07xWIMGRdv6GEhykfQ','https://news.bistu.edu.cn/jjxy/00263c997cd04ecb8bf9a6b473ff1422.html','https://mp.weixin.qq.com/s/yntA7okHDdF0iZrz3-OwwA','https://mp.weixin.qq.com/s/axA9-MjsEOuNV3ranRvnPg','https://mp.weixin.qq.com/s/oZ6FMYwiNS87RMfVPjygEw','https://mp.weixin.qq.com/s/TFA52PeBlGpmyKtlVPUO4A']
          for u in urls:
              print('=====', u)
              try:
                  slug, t, n = I.build(u, 'news', 'check')
                  print(io.open(f'_pending/{slug}.md', encoding='utf-8').read())
              except Exception as e:
                  print('ERR', e)
          PY
