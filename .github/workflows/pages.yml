# 生成并发布网站（代替 GitHub 默认的 pages-build-deployment）
# 为什么自己写：默认流程的「发布」一步最多等 10 分钟，网站变大后 GitHub 那边慢时会超时失败（2026-11-10 连续出现）；
# 这里把等待放宽到 30 分钟，并且多次发布排队依次进行、不互相取消。
# 触发：任何人推送到 main（投稿、审核、改比分……）；机器人提交（缩略图/原图/转载）用 gh workflow run 手动触发本流程。
name: 生成并发布网站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
